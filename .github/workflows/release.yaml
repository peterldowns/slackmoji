name: release

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  upload-binaries:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7
      - name: setup-go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # ratchet:actions/setup-go@v7
        with:
          go-version: "1.25"
          cache: true
          cache-dependency-path: go.sum
      - name: build-and-upload
        run: |
          set -euo pipefail
          mkdir -p bin
          ldflags=$(./scripts/golang-ldflags.sh)
          upload_url=$(./scripts/upsert-gh-release.sh)
          for target in darwin-amd64 darwin-arm64 linux-amd64 linux-arm64; do
            goos=${target%-*}
            goarch=${target#*-}
            binary="slackmoji-$target"
            CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" go build -trimpath -ldflags "$ldflags" -o "./bin/$binary" .
            curl --fail-with-body --silent --show-error \
              -H "Authorization: token $GH_TOKEN" \
              -H "Content-Type: application/octet-stream" \
              --data-binary "@bin/$binary" \
              "$upload_url?name=$binary&label=$binary"
          done
